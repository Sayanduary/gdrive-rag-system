services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdrive-rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_DB_PATH=/app/data/chroma_db
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gdrive-rag-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
