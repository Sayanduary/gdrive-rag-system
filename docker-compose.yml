services:
  lmstudio:
    build:
      context: ./lmstudio
      dockerfile: Dockerfile
    container_name: gdrive-rag-lmstudio
    restart: unless-stopped
    ports:
      - "1234:1234"
    volumes:
      - lmstudio-models:/root/.cache/lm-studio

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdrive-rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_DB_PATH=/app/data/chroma_db
      - LM_STUDIO_BASE_URL=${LM_STUDIO_BASE_URL:-http://lmstudio:1234}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      - lmstudio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gdrive-rag-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  lmstudio-models:
